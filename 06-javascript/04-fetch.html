<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet" href="04-fetch.css" />
  </head>
  <body>
    <main>
      <nav class="navbar">
        <h1 class="brand-logo">Pokedex</h1>
        <label for="pokemon-search" class="visually-hidden"
          >Search Pokémon</label
        >
        <input
          id="pokemon-search"
          type="text"
          class="search-box"
          placeholder="Search Pokémon..."
        />
      </nav>
      <!-- Use the loader.gif provided in the images/ folder -->
      <div class="loader">
        <img src="../images/loader.gif" alt="Loading..." />
        <p>Fetching data...</p>
      </div>
      <div class="pokemon-container"></div>
    </main>
    <script src="04-fetch.js"></script>
  </body>
</html>
